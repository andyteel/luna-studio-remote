<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LUNA Switch Ultra-Thin Frame CSS Demo</title>
<style>
:root{
  --page-bg:#181c21;
  --frame-top:#24292e;
  --frame-bottom:#08090a;
  --well:#050606;

  /* cap family based on #979CA0 */
  --cap-base:#979CA0;
  --cap-light:#a8adb1;
  --cap-dark:#858a8e;
  --cap-border:#73787c;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at center, #242a31 0%, var(--page-bg) 62%);
  font-family:system-ui,sans-serif;
}

.stage{
  display:grid;
  gap:18px;
  justify-items:center;
}

.luna-switch{
  width:180px;
  aspect-ratio:1;
  position:relative;
  border:0;
  padding:0;
  border-radius:5px;
  cursor:pointer;
  background:
    linear-gradient(145deg, rgba(255,255,255,.13), transparent 18%),
    linear-gradient(to bottom, var(--frame-top), var(--frame-bottom));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 1px rgba(0,0,0,.72),
    0 8px 18px rgba(0,0,0,.42);
}

/* ultra-thin dark well/frame */
.luna-switch::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:3px;
  background:var(--well);
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.82),
    inset 0 -1px 0 rgba(255,255,255,.045);
}

/* pressable cap */
.luna-switch::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:2px;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.28) 0%,
      rgba(255,255,255,.09) 17%,
      rgba(255,255,255,0) 42%,
      rgba(0,0,0,.12) 100%
    ),
    repeating-linear-gradient(
      0deg,
      rgba(180,185,189,.20) 0 1px,
      transparent 1px 5px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 4px,
      rgba(105,110,114,.18) 4px 5px
    ),
    linear-gradient(
      to bottom,
      var(--cap-light),
      var(--cap-base) 55%,
      var(--cap-dark)
    );
  border:1px solid var(--cap-border);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.48),
    inset 1px 0 1px rgba(255,255,255,.18),
    inset -1px 0 2px rgba(0,0,0,.16),
    inset 0 -2px 3px rgba(0,0,0,.20),
    0 1px 2px rgba(0,0,0,.55);
  transition:
    transform .075s ease,
    filter .075s ease,
    box-shadow .075s ease;
}

.luna-switch:hover::after{
  filter:brightness(1.02);
}

/* click/depress action */
.luna-switch:active::after,
.luna-switch.is-on::after{
  transform:translateY(2px);
  filter:brightness(.95);
  box-shadow:
    inset 0 4px 8px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.18),
    0 0 1px rgba(0,0,0,.55);
}

.caption{
  color:#cfd4d8;
  font-size:13px;
  letter-spacing:.04em;
  opacity:.85;
}
</style>
</head>
<body>
  <div class="stage">
    <button class="luna-switch" aria-label="CSS LUNA switch"></button>
    <div class="caption">Ultra-thin frame, clickable, #979CA0 cap</div>
  </div>
</body>
</html>
